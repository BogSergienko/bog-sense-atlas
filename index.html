function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');lang=v.lang==='en'?'en':'ru';custom=Array.isArray(v.custom)?v.custom.filter(validate).slice(0,40):[];active=typeof v.active==='string'&&[...BASE,...custom].some(x=>x.id===v.active)?v.active:'zero';responses=Array.isArray(v.responses)?v.responses.slice(0,8).map((r,i)=>normalizeResponse(r,i)).filter(Boolean):[];progress=v.progress&&typeof v.progress==='object'&&!Array.isArray(v.progress)?v.progress:{};index=Math.max(0,Math.min(8,Number.isInteger(v.index)?v.index:0));if(index>responses.length)index=responses.length;screen=v.screen==='play'?'play':'hub';savedRuns=Array.isArray(v.savedRuns)?v.savedRuns.slice(-10):[];}catch(e){/* storage may be blocked on file:// */}}
function normalizeResponse(r,i){if(r&&r.kind==='custom'&&typeof r.text==='string')return {kind:'custom',text:safe(r.text,2000)};if(r&&r.kind==='option'&&Number.isInteger(r.index)&&r.index>=0&&r.index<4)return {kind:'option',index:r.index};return null}
function validate(p){if(!p||typeof p!=='object'||p.custom!==true||typeof p.id!=='string'||typeof p.locale!=='string'||!p.content||typeof p.content!=='object')return false;let c=p.content;if(typeof c.title!=='string'||c.title.length>130||typeof c.desc!=='string'||c.desc.length>400||!Array.isArray(c.steps)||c.steps.length!==8)return false;return c.steps.every(s=>s&&typeof s.anchor==='string'&&s.anchor.length<=60&&typeof s.question==='string'&&s.question.length<=500&&Array.isArray(s.options)&&s.options.length>=2&&s.options.length<=4&&s.options.every(o=>typeof o==='string'&&o.length<=240));}
function renderShell(){let l=L();document.documentElement.lang=lang;for(let [id,v] of [['brand',l.eyebrow],['private',l.private],['subtitle',l.subtitle],['topline',l.topline],['lede',l.lede],['topicsHeading',l.topics],['importBtn',l.importPacks],['exportBtn',l.exportPacks],['copiesHeading',l.copies],['noCustom',custom.length?'':l.noCustom],['about',l.about],['aboutText',l.transparency],['storage',storageAvailable?l.storage:l.storageBlocked],['hubBtn',l.hub],['cloneBtn',l.new],['editBtn',l.edit],['routeStructure',l.topics],['sourcesTitle',l.linked],['limits',l.transparency],['attribution',l.attribution],['footer',l.footer],['source1',l.source1],['source2',l.source2],['source3',l.source3],['source4',l.source4]])text(id,v);text('lang',lang==='ru'?'EN':'RU');el('hub').classList.toggle('hidden',screen!=='hub');el('play').classList.toggle('hidden',screen!=='play');if(screen==='hub')drawHub();else drawPlay()}
function drawHub(){el('routes').replaceChildren();for(let p of [...BASE,...custom]){let c=content(p),b=make('button','route');b.type='button';b.dataset.route=p.id;let a=make('span','cat',p.custom?L().category.custom:L().category[p.category]||p.category),h=make('strong','',c.title),d=make('small','',c.desc),arrow=make('span','arrow',lang==='ru'?'Открыть ↗':'Open ↗');b.append(a,h,d,arrow);el('routes').appendChild(b)}}
function openRoute(id){active=id;const prior=progress[id];index=prior&&Number.isInteger(prior.index)?Math.max(0,Math.min(8,prior.index)):0;responses=prior&&Array.isArray(prior.responses)?prior.responses.slice(0,8).map((r,i)=>normalizeResponse(r,i)).filter(Boolean):[];if(index>responses.length)index=responses.length;screen='play';savedStatus='';store();renderShell();el('play').scrollIntoView({block:'start'});}
function drawPlay(){let l=L(),p=route(),c=content(p);text('topicCat',p.custom?l.category.custom:l.category[p.category]);text('topicTitle',c.title);text('topicDesc',c.desc);el('editBtn').classList.toggle('hidden',!isCustom());let loop=el('loop');loop.replaceChildren();c.steps.forEach((s,i)=>{let n=make('div','looprow'+(i===index?' active':''),(i===7?'↻ ':`${i+1} · `)+s.anchor);loop.appendChild(n)});el('stepbar').replaceChildren();for(let i=0;i<8;i++)el('stepbar').appendChild(make('span',i===index?'active':i<index?'done':''));text('back',l.back);el('back').disabled=index===0;el('ownText').classList.toggle('hidden',index===8);el('saveOwn').classList.toggle('hidden',index===8);el('ownLabel').classList.toggle('hidden',index===8);if(index===8){drawResult();return}let s=c.steps[index];text('stepCount',`${l.progress} ${index+1} / 8`);text('anchor',s.anchor);text('question',s.question);text('ownLabel',l.own);el('ownText').placeholder=l.ownPlace;el('ownText').value=responses[index]?.kind==='custom'?responses[index].text:'';text('saveOwn',l.saveOwn);text('next',index===7?l.close:l.next);el('next').disabled=!responses[index];let box=el('choices');box.replaceChildren();s.options.forEach((o,i)=>{let b=make('button','choice'+(responses[index]?.kind==='option'&&responses[index].index===i?' on':''),o);b.type='button';b.dataset.choice=i;b.setAttribute('aria-pressed',responses[index]?.kind==='option'&&responses[index].index===i?'true':'false');box.appendChild(b)});el('result').replaceChildren();text('playStatus',savedStatus);}
function pick(r){responses[index]=r;responses.length=index+1;savedStatus='';store();drawPlay()}
function drawResult(){let l=L(),p=route();text('stepCount',l.finish);text('anchor','↻');text('question',stateText(responses[0],0)===stateText(responses[7],7)?l.same:l.changed);el('choices').replaceChildren();let box=el('result');box.replaceChildren();let head=make('h3','',l.story),a=make('div','result'),b=make('p','',`${l.initial}: ${stateText(responses[0],0)}`),c=make('p','',`${l.return}: ${stateText(responses[7],7)}`);a.append(b,c);let ol=make('ol','trace');content(route()).steps.forEach((s,i)=>{let li=make('li');li.append(make('strong','',s.anchor+': '),document.createTextNode(stateText(responses[i],i)));ol.appendChild(li)});let controls=make('div','toolbar'),download=make('button','light smallbtn',l.download),prompt=make('button','light smallbtn',l.prompt);download.id='downloadReport';prompt.id='buildPrompt';controls.append(download,prompt);let nearby=make('div','source');nearby.appendChild(make('div','eyebrow',l.linkedNext));let nextList=make('div','toolbar');(LINKS[p.category==='custom'?'zero':p.id]||['zero']).forEach(id=>{let target=BASE.find(x=>x.id===id);if(target){let btn=make('button','ghost smallbtn',target[lang].title+' ↗');btn.dataset.linkRoute=id;nextList.appendChild(btn)}});nearby.appendChild(nextList);box.append(head,a,ol,controls,nearby);text('next',l.again);el('next').disabled=false;text('playStatus',savedStatus);}
function report(){let c=content(route()),d=new Date().toISOString();return `# ${c.title}\n\n${c.desc}\n\nProject BOG Sense Atlas v0.2 · ${d}\n\n`+c.steps.map((s,i)=>`## ${i===7?'↻':i+1} · ${s.anchor}\n${s.question}\n\n**${lang==='ru'?'Ответ':'Answer'}:** ${stateText(responses[i],i)}\n`).join('\n')+`\n---\n${lang==='ru'?'Собственный маршрут размышлений: ответы не являются доказательством объективной истины.':'Personal reasoning path: answers are not evidence of objective truth.'}\n`}
function aiPrompt(){return `${L().promptIntro}\n\n${report()}\n${lang==='ru'?'После разбора верни мне один вопрос, который может изменить исходное понимание; не повторяй ответы без проверки.':'After analysis, return one question that could revise the starting understanding; do not repeat my answers uncritically.'}`}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type}));let a=make('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function finish(){if(index===7&&responses.length===8){savedRuns.push({id:active,date:new Date().toISOString(),answerBefore:stateText(responses[0],0),answerAfter:stateText(responses[7],7)});savedRuns=savedRuns.slice(-10);}index++;store();drawPlay()}
function showEditor(duplicate=false){let p=route(),c=content(p);draft={id:duplicate?'custom-'+Date.now()+'-'+Math.floor(Math.random()*1000):active,custom:true,locale:duplicate?lang:(p.locale||lang),content:JSON.parse(JSON.stringify(c))};let l=L();text('editorTitle',l.editor);text('editorWarn',l.warn);text('titleLabel',l.editTitle);text('descLabel',l.editDesc);text('questionsLabel',l.questions);text('editorCancel',l.cancel);text('editorSave',l.save);text('deleteCustom',l.delete);el('deleteCustom').classList.toggle('hidden',duplicate);el('editTitleInput').value=c.title;el('editDescInput').value=c.desc;el('editSteps').replaceChildren();c.steps.forEach((s,i)=>{let section=make('div','editstep');let h=make('h3','',`${i===7?'↻':i+1} · ${s.anchor}`),qa=make('label','field',`${i+1} · ${l.questions}`),q=make('textarea');q.rows=2;q.maxLength=500;q.dataset.editorQuestion=i;q.value=s.question;let oa=make('label','field',l.options),o=make('textarea');o.rows=3;o.dataset.editorOptions=i;o.value=s.options.join('\n');section.append(h,qa,q,oa,o);el('editSteps').appendChild(section)});text('editorStatus','');el('editorModal').classList.remove('hidden');el('editTitleInput').focus()}
function closeEditor(){el('editorModal').classList.add('hidden');draft=null}
function saveEditor(){let l=L();draft.content.title=safe(el('editTitleInput').value,130);draft.content.desc=safe(el('editDescInput').value,400);for(let i=0;i<8;i++){draft.content.steps[i].question=safe(document.querySelector(`[data-editor-question="${i}"]`).value,500);draft.content.steps[i].options=document.querySelector(`[data-editor-options="${i}"]`).value.split(/\r?\n/).map(x=>safe(x,240)).filter(Boolean).slice(0,4)}if(!draft.content.title||draft.content.steps.some(s=>!s.question||s.options.length<2)){text('editorStatus',lang==='ru'?'Нужно название, восемь вопросов и минимум два ответа к каждому.':'A title, eight questions, and at least two answers each are required.');return}if(!validate(draft)){text('editorStatus','Invalid pathway structure');return}let i=custom.findIndex(x=>x.id===draft.id);if(i>=0)custom[i]=draft;else custom.push(draft);active=draft.id;index=0;responses=[];delete progress[active];screen='play';store();closeEditor();renderShell()}
function exportCustom(){if(!custom.length){alert(L().exportEmpty);return}download('BOG_my_pathways.json',JSON.stringify({format:'bog-sense-atlas-packs',version:1,paths:custom},null,2),'application/json')}
async function importCustom(file){if(!file)return;if(file.size>250000){alert(L().importErr+'file too large');return}try{let raw=await file.text(),v=JSON.parse(raw);if(v.format!=='bog-sense-atlas-packs'||v.version!==1||!Array.isArray(v.paths)||v.paths.length>40)throw Error('Invalid atlas format');let ok=0;for(let input of v.paths){if(!validate(input))throw Error('Invalid pathway fields');if(custom.length>=40)break;let p=JSON.parse(JSON.stringify(input));p.id='custom-'+Date.now()+'-'+ok+'-'+Math.floor(Math.random()*10000);custom.push(p);ok++;}store();renderShell();alert(L().importOk+ok)}catch(e){alert(L().importErr+e.message)}finally{el('jsonInput').value=''}}
function openPrompt(){text('promptTitle',L().prompt);text('promptWarn',L().promptHint);text('promptCopy',L().copy);text('promptStatus','');el('promptText').value=aiPrompt();el('promptModal').classList.remove('hidden');el('promptText').focus()}
async function copyPrompt(){try{await navigator.clipboard.writeText(el('promptText').value);text('promptStatus',L().copyOk)}catch(e){el('promptText').focus();el('promptText').select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}text('promptStatus',ok?L().copyOk:L().copyFail)}}
function wire(){el('lang').addEventListener('click',()=>{lang=lang==='ru'?'en':'ru';store();renderShell()});el('routes').addEventListener('click',e=>{let b=e.target.closest('button[data-route]');if(b)openRoute(b.dataset.route)});el('hubBtn').addEventListener('click',()=>{screen='hub';store();renderShell()});el('choices').addEventListener('click',e=>{let b=e.target.closest('button[data-choice]');if(b)pick({kind:'option',index:Number(b.dataset.choice)})});el('saveOwn').addEventListener('click',()=>{let v=safe(el('ownText').value,2000);if(v)pick({kind:'custom',text:v})});el('back').addEventListener('click',()=>{if(index>0){index--;store();drawPlay()}});el('next').addEventListener('click',()=>{if(index===8){if(confirm(L().canReset)){index=0;responses=[];store();drawPlay()}return}if(!responses[index])return;finish()});el('cloneBtn').addEventListener('click',()=>showEditor(true));el('editBtn').addEventListener('click',()=>showEditor(false));el('editorClose').addEventListener('click',closeEditor);el('editorCancel').addEventListener('click',closeEditor);el('editorSave').addEventListener('click',saveEditor);el('deleteCustom').addEventListener('click',()=>{if(confirm(L().confirmDelete)){custom=custom.filter(x=>x.id!==draft.id);delete progress[draft.id];active='zero';screen='hub';index=0;responses=[];store();closeEditor();renderShell()}});el('exportBtn').addEventListener('click',exportCustom);el('importBtn').addEventListener('click',()=>el('jsonInput').click());el('jsonInput').addEventListener('change',e=>importCustom(e.target.files?.[0]));el('result').addEventListener('click',e=>{if(e.target.closest('#downloadReport'))download('BOG_reasoning_path.md',report(),'text/markdown');if(e.target.closest('#buildPrompt'))openPrompt();let link=e.target.closest('button[data-link-route]');if(link)openRoute(link.dataset.linkRoute)});el('promptClose').addEventListener('click',()=>el('promptModal').classList.add('hidden'));el('promptCopy').addEventListener('click',copyPrompt);document.addEventListener('keydown',e=>{if(e.key==='Escape'){el('promptModal').classList.add('hidden');if(!el('editorModal').classList.contains('hidden'))closeEditor()}})}
load();wire();renderShell();
</script></body></html>
